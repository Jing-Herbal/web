<!-- Favicons — light/dark adaptive -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-dark.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="shortcut icon" href="/favicon.ico">

<style>
.page-hero{background:var(--ink);color:#fff;padding:3.5rem 2rem}
.page-hero-inner{max-width:1200px;margin:0 auto}
.ph-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--jade);margin-bottom:1rem}
.ph-title{font-family:var(--serif);font-size:2.6rem;letter-spacing:-0.03em;line-height:1.08;color:#fff;margin-bottom:0.75rem}
.ph-title em{font-style:italic;color:#9FE1CB}
.ph-body{font-size:0.9rem;color:rgba(255,255,255,0.5);max-width:560px;line-height:1.7}

.content{max-width:1200px;margin:0 auto;padding:3rem 2rem}

.post-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}

/* featured (first) card spans full width */
.post-card{background:var(--white);border:0.5px solid var(--border);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:border-color .2s,transform .2s,box-shadow .2s}
.post-card:hover{border-color:var(--jade);transform:translateY(-2px);box-shadow:0 18px 40px -28px rgba(28,38,32,0.4)}
.post-card-media{aspect-ratio:16/9;overflow:hidden;background:var(--cream)}
.post-card-media img{width:100%;height:100%;object-fit:cover;display:block}
.post-card-body{padding:1.4rem 1.5rem 1.6rem;display:flex;flex-direction:column;flex:1}
.post-card-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--jade);margin-bottom:0.6rem}
.post-card-title{font-family:var(--serif);font-size:1.35rem;line-height:1.2;letter-spacing:-0.02em;color:var(--ink);margin-bottom:0.6rem}
.post-card-excerpt{font-size:0.88rem;color:var(--ink2);line-height:1.65;margin-bottom:1rem}
.post-card-meta{margin-top:auto;display:flex;align-items:center;gap:0.6rem;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.post-card-meta .dot{color:var(--jade);opacity:0.6}
.post-card-cta{color:var(--jade-d);font-weight:500;margin-left:auto}

.post-card.is-featured{grid-column:1 / -1;flex-direction:row}
.post-card.is-featured .post-card-media{aspect-ratio:auto;flex:1 1 52%;min-height:300px}
.post-card.is-featured .post-card-body{flex:1 1 48%;justify-content:center;padding:2.5rem}
.post-card.is-featured .post-card-title{font-size:2rem}
.post-card.is-featured .post-card-excerpt{font-size:0.95rem;max-width:46ch}
.featured-flag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--jade-d);background:var(--jade-l);border-radius:99px;padding:3px 10px;margin-bottom:1rem;width:fit-content}

.blog-empty{grid-column:1 / -1;text-align:center;color:var(--ink3);font-size:0.9rem;padding:3rem 0}

@media (max-width:900px){
  .post-grid{grid-template-columns:1fr 1fr}
  .post-card.is-featured{flex-direction:column}
  .post-card.is-featured .post-card-media{aspect-ratio:16/9;min-height:0}
  .post-card.is-featured .post-card-body{padding:1.6rem}
  .post-card.is-featured .post-card-title{font-size:1.6rem}
}
@media (max-width:600px){
  .post-grid{grid-template-columns:1fr}
  .page-hero{padding:2.5rem 1.25rem}
  .content{padding:2rem 1.25rem 3rem}
}
</style>
</head>
<body>
<div id="nav-root"></div>

<div class="page-hero">
  <div class="page-hero-inner">
    <div class="ph-eyebrow">The Jing Journal</div>
    <h1 class="ph-title">Notes from <em>the lab</em>,<br>the field &amp; the company</h1>
    <p class="ph-body">Company news, sourcing notes, and writing on the evidence behind traditional herbs — published when there's something worth saying, not on a schedule.</p>
  </div>
</div>

<div class="content" id="blog-content"></div>

<div id="footer-root"></div>
<script src="shared.js"></script>
<script>
document.getElementById('nav-root').innerHTML = renderNav('');
document.getElementById('footer-root').innerHTML = renderFooter();
initKlaviyo();
initMegas();

const POSTS = [
  {
    slug:'monash-sine-co-incubation',
    eyebrow:'Company news · Research & sourcing',
    title:"We've joined the Monash–IIT Bombay co-incubation program",
    excerpt:"Jing has been selected for the co-incubation program run by Monash University and SINE at IIT Bombay — accelerating research, sourcing and innovation between Australia and India.",
    image:'/blog/monash-sine-co-incubation/hero.jpg',
    date:'12 June 2026',
    readTime:'5 min read',
    featured:true,
  },
];

function renderCard(p){
  return `
  <a class="post-card${p.featured?' is-featured':''}" href="/blog/${p.slug}">
    <div class="post-card-media"><img src="${p.image}" alt="${p.title.replace(/"/g,'&quot;')}" loading="lazy"></div>
    <div class="post-card-body">
      ${p.featured?'<span class="featured-flag">Latest</span>':''}
      <div class="post-card-eyebrow">${p.eyebrow}</div>
      <div class="post-card-title">${p.title}</div>
      <div class="post-card-excerpt">${p.excerpt}</div>
      <div class="post-card-meta">
        <time>${p.date}</time>
        <span class="dot">·</span>
        <span>${p.readTime}</span>
        <span class="post-card-cta">Read →</span>
      </div>
    </div>
  </a>`;
}

document.getElementById('blog-content').innerHTML =
  POSTS.length
    ? `<div class="post-grid">${POSTS.map(renderCard).join('')}</div>`
    : `<div class="post-grid"><div class="blog-empty">New writing coming soon.</div></div>`;
</script>
</body>
</html>
